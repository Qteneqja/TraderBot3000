[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aegistrade-ai"
version = "0.1.0"
description = "Risk-controlled trading research and paper execution"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1", "websockets>=14,<17", "pandas>=2.2,<3", "numpy>=2,<3",
  "pyarrow>=19,<24", "scikit-learn>=1.6,<2", "joblib>=1.4,<2", "scipy>=1.15,<2"
]

[project.optional-dependencies]
research = ["lightgbm>=4.5,<5", "xgboost>=3,<4", "optuna>=4,<5", "statsmodels>=0.14,<1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
