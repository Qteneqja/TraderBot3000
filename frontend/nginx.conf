server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # Compose can replace backend with a new IP while this container stays running.
    # A variable proxy target uses Docker DNS again after this short cache expires.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    set $backend_origin http://backend:8000;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    location /api/ { proxy_pass $backend_origin$request_uri; }
    location /health/ { proxy_pass $backend_origin$request_uri; }
    location / { try_files $uri $uri/ /index.html; }
}
