name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aegis
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U aegis" --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.13'}
      - run: pip install -r backend/requirements.lock
      - run: pip install --no-deps -e backend
      - run: python -m pytest backend/tests -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://aegis:test@localhost:5432/aegis
      - run: ruff check backend
      - name: Verify PostgreSQL migration and fixtures
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://aegis:test@localhost:5432/aegis
        run: |
          alembic upgrade head
          python -m app.cli init --demo
          alembic check
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.13'}
      - name: Verify proxy recovery after backend IP changes
        run: |
          docker build -t aegistrade-proxy-test .
          python ../scripts/verify_proxy_recovery.py --frontend-image aegistrade-proxy-test
